services:
  web:
    build: .
    image: veg-price-index:latest
    ports:
      - "8000:8000"
    environment:
      DATABASE_PATH: /data/prices.db
      SECRET_KEY: change-me-in-production
      DEMO_ENABLED: "1"
    volumes:
      - price-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  price-data:
